name: HostyCare production release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful production-build.yml run ID for the selected commit
        required: true
        type: string
      release_sha:
        description: Exact 40-character commit SHA produced by that build
        required: true
        type: string
      verify_only:
        description: Validate and re-publish the artifact without contacting HostyCare
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: hostycare-production
  cancel-in-progress: false

jobs:
  verify-artifact:
    if: github.ref == 'refs/heads/feature/50-palettes-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the source build run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]{1,16}$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            -o "$RUNNER_TEMP/build-run.json"
          python3 - <<'PY'
          import json, os, sys
          run = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "build-run.json"), encoding="utf-8"))
          valid = (
              run.get("path") == ".github/workflows/production-build.yml"
              and run.get("head_branch") == "feature/50-palettes-v2"
              and run.get("head_sha") == os.environ["RELEASE_SHA"]
              and run.get("conclusion") == "success"
              and run.get("event") in {"push", "workflow_dispatch"}
          )
          if not valid:
              raise SystemExit("STOP: selected run is not a successful production build for this feature-branch commit")
          print("PASS: source build run and commit match")
          PY

      - name: Download immutable build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hostycare-standalone-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/hostycare-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify package checksum and archive paths
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          cd "$RUNNER_TEMP/hostycare-artifact"
          archive="srikalahasti-release-$RELEASE_SHA.tar.gz"
          test -f "$archive" && test -f "$archive.sha256"
          sha256sum -c "$archive.sha256"
          python3 - "$archive" "$RELEASE_SHA" <<'PY'
          import posixpath, sys, tarfile
          archive, expected = sys.argv[1:]
          with tarfile.open(archive, "r:gz") as package:
              members = package.getmembers()
              names = [m.name.removeprefix("./") for m in members]
              for member, name in zip(members, names):
                  if member.name.startswith("/") or ".." in name.split("/"):
                      raise SystemExit("STOP: unsafe path in release archive")
                  if member.issym():
                      target = posixpath.normpath(posixpath.join(posixpath.dirname(name), member.linkname))
                      if member.linkname.startswith("/") or target == ".." or target.startswith("../"):
                          raise SystemExit("STOP: unsafe symlink in release archive")
                      continue
                  if member.islnk() or not (member.isfile() or member.isdir()):
                      raise SystemExit("STOP: unsafe file type in release archive")
                  parts = name.split("/")
                  if any(part == ".git" or part == "backups" or part == "artifacts" or part == "logs" or part == ".DS_Store" or part.startswith(".env") or part.endswith((".bak", ".backup", ".before")) for part in parts):
                      raise SystemExit("STOP: forbidden content in release archive")
              metadata = package.extractfile("./RELEASE_SHA") or package.extractfile("RELEASE_SHA")
              if metadata is None or metadata.read().decode().strip() != expected:
                  raise SystemExit("STOP: release metadata does not match the requested SHA")
          print("PASS: archive paths, file types, checksum, and SHA verified")
          PY

      - name: Re-publish verified artifact to this protected run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-hostycare-release
          path: |
            ${{ runner.temp }}/hostycare-artifact/srikalahasti-release-${{ inputs.release_sha }}.tar.gz
            ${{ runner.temp }}/hostycare-artifact/srikalahasti-release-${{ inputs.release_sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify-artifact
    if: github.ref == 'refs/heads/feature/50-palettes-v2' && inputs.verify_only == false && vars.HOSTYCARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: hostycare-production
      url: https://srikalahastikalamkari.in
    steps:
      - name: Checkout release control script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-hostycare-release
          path: ${{ runner.temp }}/hostycare-artifact

      - name: Stage, preflight, activate, and verify with rollback
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          HOST: ${{ vars.HOSTYCARE_SSH_HOST }}
          USER: ${{ vars.HOSTYCARE_SSH_USER }}
          PORT: ${{ vars.HOSTYCARE_SSH_PORT }}
          APP_ROOT: ${{ vars.HOSTYCARE_APP_ROOT }}
          KNOWN_HOSTS: ${{ vars.HOSTYCARE_KNOWN_HOSTS }}
          HEALTH_URL: ${{ vars.HOSTYCARE_HEALTH_URL }}
          SSH_KEY: ${{ secrets.HOSTYCARE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( PORT > 0 && PORT < 65536 ))
          [[ "$APP_ROOT" == "/home/srikalah/srikalahasti-app" ]]
          [[ "$HEALTH_URL" == "https://srikalahastikalamkari.in/api/health" ]]
          [[ "$KNOWN_HOSTS" == *"$HOST"* && -n "$SSH_KEY" ]]
          archive="$RUNNER_TEMP/hostycare-artifact/srikalahasti-release-$RELEASE_SHA.tar.gz"
          checksum="$archive.sha256"
          ssh_dir="$RUNNER_TEMP/hostycare-ssh"
          mkdir -m 700 "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          ssh-keygen -F "$HOST" -f "$ssh_dir/known_hosts" >/dev/null
          ssh_args=(-p "$PORT" -i "$ssh_dir/id_ed25519" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts")
          scp_args=(-P "$PORT" -i "$ssh_dir/id_ed25519" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts")
          remote="$USER@$HOST"
          ssh "${ssh_args[@]}" "$remote" mkdir -p "$APP_ROOT/incoming"
          scp "${scp_args[@]}" "$archive" "$checksum" "$remote:$APP_ROOT/incoming/"
          if ! ssh "${ssh_args[@]}" "$remote" bash -s -- prepare "$RELEASE_SHA" "$APP_ROOT" < scripts/hostycare-release.sh; then
            echo "Release staging failed; current release was not switched."
            exit 1
          fi
          if ! ssh "${ssh_args[@]}" "$remote" bash -s -- activate "$RELEASE_SHA" "$APP_ROOT" < scripts/hostycare-release.sh; then
            ssh "${ssh_args[@]}" "$remote" bash -s -- rollback "$RELEASE_SHA" "$APP_ROOT" < scripts/hostycare-release.sh || true
            exit 1
          fi
          healthy=false
          for attempt in {1..12}; do
            status=$(curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$HEALTH_URL" || true)
            if [[ "$status" == "200" ]] && python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("status")=="ok" else 1)' "$RUNNER_TEMP/health.json"; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            ssh "${ssh_args[@]}" "$remote" bash -s -- rollback "$RELEASE_SHA" "$APP_ROOT" < scripts/hostycare-release.sh
            exit 1
          fi
          for route in / /login /register /admin/login /shop /robots.txt /sitemap.xml; do
            code=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "https://srikalahastikalamkari.in$route")
            if [[ "$code" != "200" ]]; then
              echo "Post-deploy route check failed; rolling back."
              ssh "${ssh_args[@]}" "$remote" bash -s -- rollback "$RELEASE_SHA" "$APP_ROOT" < scripts/hostycare-release.sh
              exit 1
            fi
          done
          rm -rf "$ssh_dir"

      - name: Report deployment boundary
        if: success()
        run: echo "Verified application release activated. Payment actions were not invoked; verify catalogue, authentication, checkout, email, and theme publishing manually before launch."
